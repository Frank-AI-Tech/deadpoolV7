<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadpool Bot Dashboard</title><style>body{margin:0;background:#0b0f14;color:#e8eef5;font:15px system-ui}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0 0 6px}section{background:#121923;border:1px solid #263242;border-radius:14px;padding:18px;margin-top:18px}input,textarea,select,button{border:1px solid #334155;border-radius:9px;background:#0e141d;color:inherit;padding:11px;font:inherit}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}button{cursor:pointer;background:#16a34a;border:0;font-weight:700}button.secondary{background:#273449}.muted{color:#94a3b8}.danger{color:#fca5a5}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #263242}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}}</style></head><body><main><header><div><h1>Deadpool Bot</h1><div class="muted">Owner dashboard · connected users and broadcasts</div></div><button class="secondary" onclick="load()">Refresh</button></header><section id="login"><h2>Owner login</h2><input id="password" type="password" placeholder="Dashboard password"><br><br><button onclick="login()">Sign in</button><p id="loginMsg" class="danger"></p></section><div id="app" hidden><section><div class="row"><div><h2>Connected users</h2><div id="count" class="muted"></div></div><button onclick="load()">Refresh users</button></div><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Phone/JID</th><th>Last seen</th><th>Chat</th></tr></thead><tbody id="users"></tbody></table></div></section><section><h2>Broadcast</h2><p class="muted">Send one message to every active user. Media must be a direct public URL the bot can fetch.</p><div class="grid"><select id="type"><option value="text">Text</option><option value="image">Image</option><option value="audio">Audio</option><option value="video">Video</option><option value="document">Document</option></select><input id="media" placeholder="Media URL (optional)"><input id="caption" placeholder="Caption"></div><br><textarea id="body" placeholder="Message text"></textarea><br><br><button onclick="broadcast()">Send broadcast</button><p id="result" class="muted"></p></section></div></main><script>async function api(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{await api('/api/dashboard/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:password.value})});loginBox(false);load()}catch(e){loginMsg.textContent=e.message}}function loginBox(show){document.getElementById('login').hidden=!show;document.getElementById('app').hidden=show}async function load(){try{const d=await api('/api/dashboard/users');count.textContent=d.users.length+' active users';users.innerHTML=d.users.map(u=>`<tr><td>${esc(u.display_name||u.push_name||'Unknown')}</td><td>${esc(u.phone||u.jid)}</td><td>${new Date(u.last_seen_at).toLocaleString()}</td><td>${esc(u.last_chat_type)}</td></tr>`).join('');loginBox(false)}catch(e){if(e.message==='Unauthorized')loginBox(true);else result.textContent=e.message}}async function broadcast(){result.textContent='Sending...';try{const d=await api('/api/dashboard/broadcast',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contentType:type.value,body:body.value,mediaUrl:media.value,caption:caption.value})});result.textContent='Queued for '+d.recipientCount+' users.';body.value='';caption.value='';}catch(e){result.textContent=e.message}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
